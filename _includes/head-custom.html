<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">

<meta name="theme-color" content="#1f1c17">

<script>
  // Set the theme before first paint so there is no flash of the wrong mode.
  // Saved choice wins; otherwise follow the OS preference.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var theme = saved
        || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<script>
  // Build a persistent light/dark toggle and wire it to localStorage.
  (function () {
    function build() {
      var root = document.documentElement;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-toggle";

      function sync() {
        var dark = root.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "☀" : "☾"; // sun / moon
        btn.title = dark ? "Switch to light mode" : "Switch to dark mode";
        btn.setAttribute("aria-label", btn.title);
        btn.setAttribute("aria-pressed", String(dark));
      }

      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });

      sync();
      document.body.appendChild(btn);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", build);
    } else {
      build();
    }
  })();
</script>

<script>
  // Lightbox: click (or Enter on) any content image to see it full-screen.
  // The caption is the italic line right after the image if there is one,
  // otherwise the alt text. Arrow keys / buttons step through every image on
  // the page; Esc, the close button, or a click outside the image closes it.
  (function () {
    function build() {
      var images = Array.from(document.querySelectorAll(".main-content img"))
        .filter(function (img) { return !img.closest("a"); });
      if (!images.length) return;

      var dialog = document.createElement("dialog");
      dialog.className = "lightbox";
      dialog.setAttribute("aria-label", "Image preview");
      dialog.innerHTML =
        '<button type="button" class="lightbox-close" aria-label="Close">×</button>' +
        '<button type="button" class="lightbox-prev" aria-label="Previous image">‹</button>' +
        '<figure><img alt=""><figcaption></figcaption></figure>' +
        '<button type="button" class="lightbox-next" aria-label="Next image">›</button>';
      document.body.appendChild(dialog);

      var full = dialog.querySelector("img");
      var caption = dialog.querySelector("figcaption");
      var current = 0;

      function captionFor(img) {
        var next = img.nextElementSibling;
        if (next && next.tagName === "EM") return next.cloneNode(true).childNodes;
        return img.alt ? [document.createTextNode(img.alt)] : [];
      }

      function show(i) {
        current = (i + images.length) % images.length;
        var img = images[current];
        full.src = img.currentSrc || img.src;
        full.alt = img.alt;
        caption.replaceChildren.apply(caption, Array.from(captionFor(img)));
        caption.hidden = !caption.childNodes.length;
      }

      function open(i) {
        show(i);
        if (!dialog.open) dialog.showModal();
      }

      images.forEach(function (img, i) {
        img.classList.add("zoomable");
        img.tabIndex = 0;
        img.setAttribute("role", "button");
        img.addEventListener("click", function () { open(i); });
        img.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(i); }
        });
      });

      var single = images.length === 1;
      dialog.querySelector(".lightbox-prev").hidden = single;
      dialog.querySelector(".lightbox-next").hidden = single;
      dialog.querySelector(".lightbox-prev").addEventListener("click", function () { show(current - 1); });
      dialog.querySelector(".lightbox-next").addEventListener("click", function () { show(current + 1); });
      dialog.querySelector(".lightbox-close").addEventListener("click", function () { dialog.close(); });

      dialog.addEventListener("keydown", function (e) {
        if (single) return;
        if (e.key === "ArrowLeft") show(current - 1);
        if (e.key === "ArrowRight") show(current + 1);
      });

      // Clicks on the dark surround (the dialog or figure itself) close it;
      // clicks on the image, caption links, or buttons don't.
      dialog.addEventListener("click", function (e) {
        if (e.target === dialog || e.target.tagName === "FIGURE") dialog.close();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", build);
    } else {
      build();
    }
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  // Kramdown turns a ```mermaid fence into <pre><code class="language-mermaid">
  // (no wrapping div here — this site's Kramdown build skips Rouge's div
  // wrapper). Convert whichever shape shows up to the <pre class="mermaid">
  // Mermaid expects, then render. Re-renders on theme toggle since Mermaid
  // bakes colors into the SVG at render time. A no-op on pages with no
  // mermaid blocks, so it's safe to include everywhere.
  (function () {
    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "default";
    }

    function findMermaidCode() {
      var nodes = new Set();
      document.querySelectorAll("code.language-mermaid").forEach(function (c) { nodes.add(c); });
      document.querySelectorAll(".language-mermaid").forEach(function (el) {
        var code = el.tagName === "CODE" ? el : el.querySelector("code");
        if (code) nodes.add(code);
      });
      return Array.from(nodes);
    }

    function convertBlocks() {
      findMermaidCode().forEach(function (code) {
        var pre = document.createElement("pre");
        pre.className = "mermaid";
        pre.textContent = code.textContent;
        (code.closest("pre") || code).replaceWith(pre);
      });
    }

    function render() {
      var blocks = document.querySelectorAll(".mermaid");
      if (!blocks.length) return;
      blocks.forEach(function (block) {
        if (!block.dataset.src) block.dataset.src = block.textContent;
        block.removeAttribute("data-processed");
        block.textContent = block.dataset.src;
      });
      mermaid.initialize({ startOnLoad: false, theme: currentTheme() });
      mermaid.run({ nodes: blocks });
    }

    function init() {
      convertBlocks();
      render();
      var toggle = document.querySelector(".theme-toggle");
      if (toggle) toggle.addEventListener("click", render);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
